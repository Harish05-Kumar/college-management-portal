spring.application.name=collegeplacement

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/college_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=${JWT_SECRET}

# RapidAPI Configuration
rapidapi.api.key=${RAPIDAPI_KEY:}
rapidapi.api.host=${RAPIDAPI_HOST:jsearch.p.rapidapi.com}
rapidapi.api.url=${RAPIDAPI_URL:https://jsearch.p.rapidapi.com}

# Gmail SMTP Configuration
# Use a Gmail app password for GMAIL_APP_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


